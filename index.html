<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maxvel</title>
<meta name="description" content="Maxvel, 15. Python, HTML and 3D printing.">
<meta name="theme-color" content="#0a0c11">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%BE%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0c11; --panel:#0f1219; --line:#232a3b; --txt:#cdd5e6; --dim:#69738f;
  --acc:#9b8cff; --acc2:#56d4f0; --ok:#7ee0a1;
  --mono:'JetBrains Mono','Fira Code',ui-monospace,'Cascadia Code',Consolas,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg)}
body{
  min-height:100vh; color:var(--txt); font:16px/1.65 var(--mono);
  background:
    radial-gradient(circle at 1px 1px,#1a2030 1px,transparent 0) 0 0/22px 22px,
    var(--bg);
  padding:clamp(12px,4vw,56px) clamp(10px,3vw,24px);
}
.win{
  max-width:820px; margin:0 auto; background:var(--panel);
  border:1px solid var(--line); border-radius:8px;
  box-shadow:6px 6px 0 #05060a;
  min-height:70vh;
}
.bar{
  display:flex; align-items:center; gap:8px; padding:10px 14px;
  border-bottom:1px solid var(--line); color:var(--dim); font-size:13px;
}
.bar i{width:11px;height:11px;border-radius:50%;background:#2a3147;display:block}
.bar i:nth-child(1){background:#ff5f6d}
.bar i:nth-child(2){background:#ffc371}
.bar i:nth-child(3){background:#7ee0a1}
.bar span{margin-left:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#term{padding:20px clamp(14px,3vw,28px) 40px}
.ln{margin-top:26px;word-break:break-word}
.ln:first-child{margin-top:0}
.ps{color:var(--acc)} .ps b{color:var(--acc2);font-weight:400}
.cmd{color:#fff}
.cur{display:inline-block;width:.6em;height:1.1em;background:var(--acc2);vertical-align:text-bottom;margin-left:2px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.out{margin-top:8px;padding-left:14px;border-left:2px solid var(--line);animation:in .35s ease-out}
@keyframes in{from{opacity:0}to{opacity:1}}
.out p+p{margin-top:8px}
.dim{color:var(--dim)}
.hl{color:var(--acc2)}
.ln.tight{margin-top:6px}
.nf{display:flex;gap:10px 26px;flex-wrap:wrap;font-size:14px}
.nf pre{font:inherit;margin:0;white-space:pre}
.nf .art{color:var(--acc);line-height:1.15}
.nf .info{line-height:1.5}
.raw{margin-top:4px;white-space:pre-wrap;word-break:break-word;color:var(--dim);font-size:14px}
.raw.pw{color:var(--txt);font-size:16px}

/* Name */
.name{
  position:relative; display:inline-block; font-size:clamp(40px,11vw,76px);
  line-height:1.05; font-weight:800; letter-spacing:-.03em; color:#fff; cursor:default;
}

/* Skills */
.files{list-style:none;display:grid;gap:6px}
.files li{display:flex;gap:12px;flex-wrap:wrap}
.files .n{color:var(--acc2);min-width:9ch}

/* Music player */
.pl{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:4px}
.cover{position:relative;width:112px;height:112px;flex:none;background:#131826;border:1px solid var(--line);box-shadow:4px 4px 0 #05060a;overflow:hidden;display:grid;place-items:center;color:var(--dim);font-size:34px}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pl-body{flex:1;min-width:230px}
.pl-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.pl-title{font-size:22px;font-weight:800;color:#fff;letter-spacing:-.01em;line-height:1.2}
.pl-sub{font-size:13px}
.eq{display:flex;gap:3px;align-items:flex-end;height:22px;flex:none}
.eq i{width:4px;height:100%;background:var(--acc2);transform-origin:bottom;transform:scaleY(.12)}
.pl.on .eq i{animation:eq .8s ease-in-out infinite alternate}
.eq i:nth-child(2){animation-duration:.55s!important;animation-delay:-.2s!important}
.eq i:nth-child(3){animation-duration:.95s!important;animation-delay:-.5s!important}
.eq i:nth-child(4){animation-duration:.65s!important;animation-delay:-.1s!important}
@keyframes eq{from{transform:scaleY(.15)}to{transform:scaleY(1)}}
.pl input[type=range]{-webkit-appearance:none;appearance:none;display:block;width:100%;height:8px;margin:14px 0 6px;cursor:pointer;
  background:linear-gradient(90deg,var(--acc),var(--acc2)) 0 0/var(--p,0%) 100% no-repeat,#1a2030;border-radius:0}
.pl input[type=range]::-webkit-slider-runnable-track{height:8px;background:transparent}
.pl input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;margin-top:-3px;background:#fff;border:2px solid var(--acc);border-radius:0;box-shadow:2px 2px 0 #05060a}
.pl input[type=range]::-moz-range-track{background:transparent;height:8px}
.pl input[type=range]::-moz-range-thumb{width:10px;height:10px;background:#fff;border:2px solid var(--acc);border-radius:0;box-shadow:2px 2px 0 #05060a}
.pl-times{display:flex;justify-content:space-between;font-size:12px}
.pl-ctl{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}
.pb{width:38px;height:38px;display:grid;place-items:center;padding:0;background:#131826;border:1px solid var(--line);border-radius:6px;box-shadow:3px 3px 0 #05060a;cursor:pointer;transition:transform .12s,box-shadow .12s,border-color .12s}
.pb:hover{border-color:var(--acc);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--acc)}
.pb:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--acc)}
.pb.big{width:46px;height:46px;border-color:var(--acc)}
.pb svg{width:20px;height:20px;stroke:var(--acc);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pb .f{fill:var(--acc)}
.pb.act{border-color:var(--acc2)} .pb.act svg{stroke:var(--acc2)}
.pl .ic-pause{display:none} .pl.on .ic-pause{display:block} .pl.on .ic-play{display:none}
.pb .ic-x{display:none} .pb.muted .ic-x{display:inline} .pb.muted .ic-wave{display:none}
.vol-w{display:flex;align-items:center;gap:8px;margin-left:auto}
.pl .vol{width:80px;margin:0}
@media (max-width:520px){.cover{width:84px;height:84px;font-size:26px}.vol-w{margin-left:0}}

/* Links */
.links{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.btn{
  display:inline-flex;align-items:center;gap:10px;padding:10px 14px;
  color:var(--txt);text-decoration:none;font:inherit;font-size:14px;cursor:pointer;
  background:#131826;border:1px solid var(--line);border-radius:6px;
  box-shadow:3px 3px 0 #05060a;transition:transform .12s,box-shadow .12s,border-color .12s;
}
.btn svg{width:22px;height:22px;stroke:var(--acc);fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn:hover{border-color:var(--acc);transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--acc)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--acc)}
.btn small{color:var(--dim);font-size:12px;display:block;line-height:1.2}
.btn b{font-weight:500;display:block;line-height:1.3}
a:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--acc2);outline-offset:3px}

/* Eingabe */
.inp{display:flex;gap:8px;margin-top:26px;align-items:center}
.inp input{
  flex:1;min-width:0;background:none;border:0;color:#fff;font:inherit;caret-color:var(--acc2);outline:0;
}
.inp input:focus-visible{outline:0}
.inp input::placeholder{color:var(--dim);opacity:1}

.bar{cursor:grab;touch-action:none;user-select:none}
.bar.drag{cursor:grabbing}
body{overflow-x:hidden}
#toast{
  position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;
  background:#131826;border:1px solid var(--acc);color:#fff;padding:8px 14px;border-radius:6px;
  font-size:14px;transition:.2s;pointer-events:none;
}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<main class="win" aria-label="Maxvel Terminal">

<script>
/* Maxvel, site built by hand. */
const term = document.getElementById('term');
const toast = document.getElementById('toast');
let fast = matchMedia('(prefers-reduced-motion: reduce)').matches;

const sleep = ms => new Promise(r => setTimeout(r, fast ? 0 : ms));
const PS = '<span class="ps">maxvel<b>@</b>top:~$</span> ';

const icon = {
  tiktok: '<svg viewBox="0 0 24 24"><path d="M14 3v11.2a3.7 3.7 0 1 1-3.7-3.7"/><path d="M14 3c.3 2.7 2 4.5 5 4.8"/></svg>',
  insta:  '<svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17" cy="7" r=".6"/></svg>',
  discord:'<svg viewBox="0 0 24 24"><path d="M7.5 6.2c3-1.2 6-1.2 9 0 1.9 2.8 2.9 6 3 9.6-1.4 1.2-3 1.9-4.6 2.2l-1-1.8M7.5 6.2c-1.9 2.8-2.9 6-3 9.6 1.4 1.2 3 1.9 4.6 2.2l1-1.8"/><circle cx="9.4" cy="12.2" r="1.2"/><circle cx="14.6" cy="12.2" r="1.2"/></svg>',

const out = {
  whoami: `<h1 class="name">Maxvel</h1>
           <p class="dim">15 y/o</p>`,
  about: `<p>Hey, I'm Maxvel.</p>
       <p>In my free time, I'm into coding, 3D printing and CAD design. I enjoy building things, experimenting with technology and turning ideas into real-world projects. Whether it's writing a script, designing a 3D model or bringing something to life with my 3D printer, I love creating things myself.</p>

             <a class="btn" href="https://www.tiktok.com/@maxvel187" target="_blank" rel="noopener">${icon.tiktok}<span><small>tiktok</small><b>@maxvel187</b></span></a>
             <a class="btn" href="https://www.instagram.com/maxvel187_" target="_blank" rel="noopener">${icon.insta}<span><small>instagram</small><b>@maxvel187_</b></span></a>

out.neofetch = `<div class="nf">
<pre class="art">  ▀▄   ▄▀  
 ▄█▀███▀█▄ 
█▀███████▀█
▀ ▀▄▄ ▄▄▀ ▀</pre>
<pre class="info"><span class="hl">maxvel</span>@<span class="hl">top</span>
----------
<span class="hl">OS</span>: Maxvel GNU/Linux x86_64
<span class="hl">Kernel</span>: 6.1.0-187-amd64
<span class="hl">Uptime</span>: 187 days
<span class="hl">Shell</span>: bash
<span class="hl">Langs</span>: python, html
<span class="hl">Hobbies</span>: 3d printing, drones</pre>

out.fplay = `<div class="pl">
  <div class="cover"><span>♪</span><img src="assets/music.png" alt="Metamorphosis - emi cover" onerror="this.remove()"></div>
  <div class="pl-body">
    <div class="pl-top">
      <div><div class="pl-title">Metamorphosis - emi</div><div class="pl-sub dim">music.mp3 - <span class="pl-state">ready</span></div></div>
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    </div>
    <input class="seek" type="range" min="0" max="1000" step="1" value="0" aria-label="Seek">
    <div class="pl-times dim"><span class="t-cur">0:00</span><span class="t-dur">-:--</span></div>
    <div class="pl-ctl">
      <button class="pb b-back" type="button" title="Back 10s" aria-label="Back 10 seconds"><svg viewBox="0 0 24 24"><path d="M11 6l-7 6 7 6zM20 6l-7 6 7 6z"/></svg></button>
      <button class="pb big b-play" type="button" title="Play / Pause" aria-label="Play or pause">
        <svg class="ic-play" viewBox="0 0 24 24"><polygon class="f" points="7,4 20,12 7,20"/></svg>
        <svg class="ic-pause" viewBox="0 0 24 24"><rect class="f" x="6" y="4" width="4" height="16"/><rect class="f" x="14" y="4" width="4" height="16"/></svg>

      <button class="pb b-loop" type="button" title="Loop" aria-label="Loop" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a3 3 0 0 1 3-3h15"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a3 3 0 0 1-3 3H3"/></svg></button>
      <div class="vol-w">
        <button class="pb b-mute" type="button" title="Mute" aria-label="Mute"><svg viewBox="0 0 24 24"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path class="ic-wave" d="M15.5 8.5a5 5 0 0 1 0 7"/><path class="ic-x" d="M17 9l5 6M22 9l-5 6"/></svg></button>
        <input class="vol" type="range" min="0" max="100" step="1" value="80" aria-label="Volume">

    </div>
  </div>
  <audio preload="metadata" src="assets/music.mp3"></audio>

const p2 = n => String(n).padStart(2, '0');
const hms = d => p2(d.getHours()) + ':' + p2(d.getMinutes()) + ':' + p2(d.getSeconds());
function fmtDate(d){
  let tz = '';
  try { tz = new Intl.DateTimeFormat('en-GB', { timeZoneName: 'short' }).formatToParts(d).find(x => x.type === 'timeZoneName').value + ' '; } catch (e) {}
  return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()] + ' ' +
    ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][d.getMonth()] + ' ' +
    d.getDate() + ' ' + hms(d) + ' ' + tz + d.getFullYear();
}

const aliases = { fplay:'fplay', 'fplay music.mp3':'fplay', about:'about', 'cat about.txt':'about', skills:'skills', ls:'skills', 'ls -l':'skills', 'ls -la':'skills', 'ls skills':'skills', 'ls skills/':'skills', socials:'socials', links:'socials', contact:'contact', mail:'contact', whoami:'whoami' };
const cmdNames = { whoami:'whoami', fplay:'fplay music.mp3', about:'cat about.txt', skills:'ls skills/', socials:'./socials.sh --all', contact:'mail --target maxvel' };

function scroll(){ scrollTo({ top: document.body.scrollHeight, behavior: fast ? 'auto' : 'smooth' }); }

function print(html, extraClass = ''){
  const d = document.createElement('div');
  d.className = 'out ' + extraClass;
  d.innerHTML = html;
  term.appendChild(d);
  scroll();
  return d;
}

const PSL = '<span class="ps">visitor<b>@</b>home:~$</span> ';

async function typeCmd(ps, text, tight){
  const line = document.createElement('div');
  line.className = 'ln' + (tight ? ' tight' : '');
  line.innerHTML = ps + '<span class="cmd"></span><span class="cur"></span>';
  term.appendChild(line);
  const el = line.querySelector('.cmd');
  await sleep(300);
  for (const ch of text){ el.textContent += ch; await sleep(30 + Math.random() * 40); }
  await sleep(250);
  line.querySelector('.cur').remove();
  scroll();
}

async function run(key, text){
  await typeCmd(PS, text || cmdNames[key]);
  const el = print(out[key]);
  if (key === 'fplay') initPlayer(el);
  await sleep(450);
}

function raw(text, cls = ''){
  const d = document.createElement('div');
  d.className = 'raw ' + cls;
  d.textContent = text;
  term.appendChild(d);
  scroll();
  return d;
}

/* SSH login intro: ssh -p 187 maxvel@top, password, Linux banner, clear */
async function boot(){
  await typeCmd(PSL, 'ssh -p 187 maxvel@top');
  await sleep(800);
  raw("Warning: Permanently added '[top]:187' (ED25519) to the list of known hosts.");
  await sleep(500);

  const pw = raw("maxvel@top's password: ", 'pw');
  const dots = document.createElement('span');
  const cur = document.createElement('span');
  cur.className = 'cur';
  pw.append(dots, cur);
  await sleep(700);
  for (let i = 0; i < 11; i++){ dots.textContent += '•'; await sleep(90 + Math.random() * 120); }
  await sleep(450);
  cur.remove();
  await sleep(700);

  const D = new Date(Date.now() - Math.random() * 1.2e8);
  const p2 = n => String(n).padStart(2, '0');
  const last = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][D.getDay()] + ' ' +
    ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][D.getMonth()] + ' ' +
    D.getDate() + ' ' + p2(D.getHours()) + ':' + p2(D.getMinutes()) + ':' + p2(D.getSeconds()) + ' ' + D.getFullYear();
  const banner = [
    'Linux top 6.1.0-187-amd64 #1 SMP PREEMPT_DYNAMIC Maxvel 6.1.187-1 x86_64',
    '',
    'The programs included with the Maxvel GNU/Linux system are free software;',
    'the exact distribution terms for each program are described in the',
    'individual files in /usr/share/doc/*/copyright.',
    '',
    'Maxvel GNU/Linux comes with ABSOLUTELY NO WARRANTY, to the extent',
    'permitted by applicable law.',
    'Last login: ' + last + ' from 10.187.0.1'
  ];
  const b = raw('');
  document.getElementById('ttl').textContent = 'maxvel@top: ~';
  for (const l of banner){ b.textContent += (b.textContent ? '\n' : '') + l; scroll(); await sleep(80); }

  await sleep(900);
  await typeCmd(PS, 'clear', true);
  await sleep(450);

  await sleep(350);
}

function echo(text){
  const line = document.createElement('div');
  line.className = 'ln';
  line.innerHTML = PS + '<span class="cmd"></span>';
  line.querySelector('.cmd').textContent = text;
  term.appendChild(line);
}

function prompt(){
  const w = document.createElement('div');
  w.className = 'inp';
  w.innerHTML = PS + '<input type="text" aria-label="Enter a command" autocomplete="off" autocapitalize="off" spellcheck="false">';
  term.appendChild(w);
  const input = w.querySelector('input');
  input.addEventListener('keydown', e => {
    if (e.key !== 'Enter') return;
    const v = input.value.trim();
    input.value = '';
    handle(v, w);
  });
  previewCmds(input);
  return { input, w };
}

/* Typewriter preview of the commands in the empty input */
async function previewCmds(input){
  const list = ['help', 'whoami', 'about', 'skills', 'socials', 'contact', 'fplay music.mp3', 'neofetch', 'uptime', 'date', 'pwd', 'clear'];
  if (matchMedia('(prefers-reduced-motion: reduce)').matches){ input.placeholder = list.join('  '); return; }
  const wait = ms => new Promise(r => setTimeout(r, ms));
  let i = 0;
  while (input.isConnected){
    const word = list[i++ % list.length];
    for (let n = 1; n <= word.length && input.isConnected; n++){ input.placeholder = word.slice(0, n); await wait(110); }
    await wait(1100);
    for (let n = word.length - 1; n >= 0 && input.isConnected; n--){ input.placeholder = word.slice(0, n); await wait(55); }
    await wait(350);
  }
}

/* Music player logic (no autoplay, the visitor presses play) */
document.addEventListener('play', e => {
  document.querySelectorAll('audio').forEach(x => { if (x !== e.target) x.pause(); });
}, true);

function initPlayer(root){
  const $ = q => root.querySelector(q);
  const a = $('audio'), pl = $('.pl'), seek = $('.seek'), vol = $('.vol'), st = $('.pl-state');
  const tc = $('.t-cur'), td = $('.t-dur');
  const mm = t => isFinite(t) ? Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0') : '-:--';
  const fill = el => el.style.setProperty('--p', (el.value / el.max * 100) + '%');
  let scrub = false;
  a.volume = 0.8; fill(seek); fill(vol);

  $('.b-play').addEventListener('click', () => { a.paused ? a.play().catch(() => {}) : a.pause(); });
  $('.b-back').addEventListener('click', () => { a.currentTime = Math.max(0, a.currentTime - 10); });
  $('.b-fwd').addEventListener('click', () => { if (a.duration) a.currentTime = Math.min(a.duration, a.currentTime + 10); });
  const loop = $('.b-loop');
  loop.addEventListener('click', () => { a.loop = !a.loop; loop.classList.toggle('act', a.loop); loop.setAttribute('aria-pressed', a.loop); });
  const mute = $('.b-mute');
  mute.addEventListener('click', () => { a.muted = !a.muted; mute.classList.toggle('muted', a.muted); });
  vol.addEventListener('input', () => { a.volume = vol.value / 100; a.muted = false; mute.classList.remove('muted'); fill(vol); });

  seek.addEventListener('pointerdown', () => { scrub = true; });
  addEventListener('pointerup', () => { scrub = false; });
  seek.addEventListener('input', () => {
    fill(seek);
    if (a.duration){ const t = seek.value / seek.max * a.duration; a.currentTime = t; tc.textContent = mm(t); }
  });

  a.addEventListener('loadedmetadata', () => { td.textContent = mm(a.duration); });
  a.addEventListener('timeupdate', () => {
    tc.textContent = mm(a.currentTime);
    if (!scrub && a.duration){ seek.value = a.currentTime / a.duration * seek.max; fill(seek); }
  });
  a.addEventListener('play', () => { pl.classList.add('on'); st.textContent = 'playing'; });
  a.addEventListener('pause', () => { pl.classList.remove('on'); st.textContent = a.ended ? 'finished' : 'paused'; });
  a.addEventListener('error', () => { st.textContent = 'error: assets/music.mp3 not found'; });
}

let ui;
function handle(v, w){
  const c = v.toLowerCase();
  w.remove();
  if (c === 'clear'){ term.innerHTML = ''; }
  else {
    echo(v);
    if (aliases[c]){ const el = print(out[aliases[c]]); if (aliases[c] === 'fplay') initPlayer(el); }
    else if (c === 'help') print('<p>Commands: <span class="hl">whoami about fplay skills socials contact</span></p><p class="dim"><span class="hl">ls pwd date uname uptime neofetch echo clear</span></p>');
    else if (c === 'pwd') print('<p>/home/maxvel</p>');
    else if (c === 'date') print('<p>' + fmtDate(new Date()) + '</p>');
    else if (c === 'uname') print('<p>Linux</p>');
    else if (c === 'uname -a') print('<p>Linux top 6.1.0-187-amd64 #1 SMP PREEMPT_DYNAMIC Maxvel 6.1.187-1 x86_64 GNU/Linux</p>');
    else if (c === 'uptime') print('<p> ' + hms(new Date()) + ' up 187 days,  4:20,  1 user,  load average: 0.18, 0.18, 0.87</p>');
    else if (c === 'neofetch') print(out.neofetch);
    else if (c === 'echo' || c.startsWith('echo ')) print('<p></p>').querySelector('p').textContent = v.slice(5);
    else if (c === 'sudo' || c.startsWith('sudo ')) print('<p>Nice try. You are just a guest here.</p>');
    else if (c === 'python') print('<p class="dim">&gt;&gt;&gt; print("hello world")<br><span style="color:var(--ok)">hello world</span></p>');
    else if (c === 'exit') print('<p>You cannot close this window. I did not build a button for it.</p>');
    else if (c !== '') print('<p>command not found: <span class="hl"></span>. Tip: help</p>').querySelector('.hl').textContent = v;
  }
  ui = prompt();
  ui.input.focus({ preventScroll: true });
  scroll();
}

/* Clicking the Discord button copies the name */
document.addEventListener('click', e => {
  const cp = e.target.closest('[data-copy]');
  if (cp){
    const t = cp.dataset.copy;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(
      () => say('Discord name copied: ' + t), () => say('Discord: ' + t));
  }
});
function say(m){
  toast.textContent = m; toast.classList.add('on');
  clearTimeout(say.t); say.t = setTimeout(() => toast.classList.remove('on'), 2200);
}

/* Draggable window (drag the title bar, double-click to reset) */
(() => {
  const win = document.querySelector('.win'), bar = win.querySelector('.bar');
  let x = 0, y = 0, x0, y0, sx, sy, bx, by, on = false;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  bar.addEventListener('pointerdown', e => {
    if (e.button) return;
    on = true; bar.setPointerCapture(e.pointerId); bar.classList.add('drag');
    sx = e.clientX; sy = e.clientY; x0 = x; y0 = y;
    const r = win.getBoundingClientRect(); bx = r.left - x; by = r.top - y;
  });
  bar.addEventListener('pointermove', e => {
    if (!on) return;
    const w = win.offsetWidth;
    x = clamp(bx + x0 + e.clientX - sx, 80 - w, innerWidth - 80) - bx;
    y = clamp(by + y0 + e.clientY - sy, 0, innerHeight - 40) - by;
    win.style.transform = `translate(${x}px, ${y}px)`;
  });
  const stop = () => { on = false; bar.classList.remove('drag'); };
  bar.addEventListener('pointerup', stop);
  bar.addEventListener('pointercancel', stop);
  bar.addEventListener('dblclick', () => { x = y = 0; win.style.transform = ''; });
})();

(async () => {
  await boot();
  for (const k of ['whoami', 'about', 'fplay', 'skills', 'socials', 'contact']) await run(k);
  ui = prompt();
  if (matchMedia('(hover: hover)').matches) ui.input.focus({ preventScroll: true });
})();
